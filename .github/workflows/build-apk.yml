name: Build APK

# Manual only: builds installable split APKs without the release keystore.
# The output is debug-signed and cannot replace an officially signed build;
# the in-app updater stays off (RELEASE_SIGNED_OFFICIALLY=false).
on:
  workflow_dispatch:
    inputs:
      dev_app_id:
        description: 'Install beside the official app (package id gets .dev)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      # rust-toolchain.toml pins 1.98.0 and the four Android targets.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          # cargokit builds into the rhttp Gradle project's buildDir.
          workspaces: plugins/rhttp/rhttp/rust -> ../../../../build/rhttp/build
          shared-key: android

      - run: flutter pub get --enforce-lockfile

      - name: Build the arm64 APK
        run: |
          args=(-PPIXIV_ALLOW_DEBUG_RELEASE_SIGNING=true)
          if [ "${{ inputs.dev_app_id }}" = "true" ]; then
            args+=(-PparfaitDevAppId=true)
          fi
          flutter build apk --release --flavor github \
            --target-platform android-arm64 \
            "${args[@]}"
          ls -l build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: parfait-arm64
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
