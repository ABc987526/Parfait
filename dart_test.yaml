# Global test timeouts.
#
# No single test needs more than a few seconds when nothing is blocked.
# A generous-but-bounded per-test timeout turns an environment
# flake (e.g. the real-socket smoke tests when the host network is
# degraded) into a fast, clearly labelled failure instead of a silent
# multi-minute hang.
timeout: 60s

tags:
  # Files that bind or connect real sockets (loopback servers, TLS probes).
  # `flutter test -x socket` leaves them out when the host network is
  # degraded; test/architecture/test_hygiene_test.dart requires the tag.
  socket:

  # Full Cartesian locale/layout and multi-state route smoke matrix.
  # PR CI excludes this tag (`flutter test -x matrix`), keeping core
  # ru/compact layout checks, core zh/regular route smokes, and router
  # table coverage on every PR; nightly-matrix.yml runs `-t matrix`
  # nightly and on PRs touching l10n, routes, or theme files.
  matrix:

  # UX review harness (test/review): scenes render the real app at device
  # size and films capture it frame by frame. The files do not end in
  # _test.dart, so a bare `flutter test` never runs them; tool/review.sh
  # does.
  review:
    timeout: 10x
